# ============================================================
# Configuration MCU USB - Creality V4.2.2 (STM32F103RET6)
# Connexion: USB vers Raspberry Pi 4
# ============================================================

[mcu]
# Port USB détecté automatiquement par Klipper
# Pour trouver le port: ls /dev/serial/by-id/
# Remplacer par le bon identifiant USB de ta carte Creality V4.2.2
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
# Alternative si plusieurs périphériques USB:
# serial: /dev/ttyUSB0
baud: 250000
restart_method: command

# ============================================================
# Stepper drivers - Creality V4.2.2 utilise des drivers TMC2208
# ============================================================

# Axe X - Translation (avant/arrière)
[stepper_x]
step_pin: PB9
dir_pin: PC2
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA5
position_endstop: 0
position_max: 235
homing_speed: 50

# Axe Y - Rotation 360° du plateau
[stepper_y]
step_pin: PB7
dir_pin: PB8
enable_pin: !PC3
microsteps: 16
# Pour rotation 360° sur 1 tour complet de plateau (diamètre 200mm)
# Ajuster rotation_distance selon la transmission mécanique
rotation_distance: 40
endstop_pin: ^PA6
position_endstop: 0
position_max: 360
homing_speed: 50

# Axe Z - Montée/Descente
[stepper_z]
step_pin: PB5
dir_pin: PB6
enable_pin: !PC3
microsteps: 16
rotation_distance: 8
endstop_pin: ^PA7
position_endstop: 0
position_min: 0
position_max: 250
homing_speed: 10
second_homing_speed: 2

# ============================================================
# Extrudeur fictif (requis par Klipper, non utilisé pour scanner)
# ============================================================

[extruder]
step_pin: PB3
dir_pin: PB4
enable_pin: !PC3
microsteps: 16
rotation_distance: 33.500
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PC8
sensor_type: NTC 100K beta 3950
sensor_pin: PA0
min_temp: 0
max_temp: 250
# Désactiver la vérification de température pour usage scanner
min_extrude_temp: 0
