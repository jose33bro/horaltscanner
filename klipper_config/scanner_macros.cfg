# ============================================================
# Macros Klipper pour scanner 3D Horaltscanner
# Séquences de scan, synchronisation capteurs + moteurs
# ============================================================

# ============================================================
# Variables globales du scanner
# ============================================================

[gcode_macro SCANNER_VARS]
variable_scan_step_y: 1.0        # Degrés par pas de rotation Y (résolution angulaire)
variable_scan_steps_total: 360   # Nombre total de pas pour 360°
variable_scan_step_x: 5.0        # Pas de translation X entre chaque couche
variable_scan_start_x: 10.0      # Position X de début de scan
variable_scan_end_x: 220.0       # Position X de fin de scan
variable_scan_z_height: 0.0      # Hauteur Z courante du scan
variable_laser_enabled: 0        # État des lasers (0=off, 1=on)
variable_scan_in_progress: 0     # Indicateur de scan en cours
gcode:
    RESPOND MSG="Variables scanner initialisées"

# ============================================================
# Macros de contrôle des lasers (GPIO Raspberry Pi)
# Les lasers sont contrôlés via l'objet [output_pin] du MCU secondaire
# ou via des commandes shell/webhook depuis l'application Python
# ============================================================

[output_pin laser_left]
# Laser gauche - GPIO pin du Raspberry Pi 4
# Utiliser le MCU secondaire (mcu rpi) si configuré
pin: rpi:gpio17
value: 0
shutdown_value: 0

[output_pin laser_right]
# Laser droit - GPIO pin du Raspberry Pi 4
pin: rpi:gpio27
value: 0
shutdown_value: 0

[gcode_macro LASERS_ON]
description: Active les deux lasers de scan
gcode:
    SET_PIN PIN=laser_left VALUE=1
    SET_PIN PIN=laser_right VALUE=1
    SET_GCODE_VARIABLE MACRO=SCANNER_VARS VARIABLE=laser_enabled VALUE=1
    RESPOND MSG="Lasers activés"

[gcode_macro LASERS_OFF]
description: Désactive les deux lasers de scan
gcode:
    SET_PIN PIN=laser_left VALUE=0
    SET_PIN PIN=laser_right VALUE=0
    SET_GCODE_VARIABLE MACRO=SCANNER_VARS VARIABLE=laser_enabled VALUE=0
    RESPOND MSG="Lasers désactivés"

# ============================================================
# Macro de homing - Mise à zéro de tous les axes
# X: translation → endstop position 0
# Y: rotation → endstop après 1 tour complet
# Z: hauteur → endstop position 0 (alignement Lidar/caméra)
# ============================================================

[gcode_macro SCANNER_HOME]
description: Home tous les axes du scanner
gcode:
    RESPOND MSG="Démarrage homing scanner..."
    G28 Z    ; Home Z en premier (sécurité)
    G28 X    ; Home axe X (translation)
    G28 Y    ; Home axe Y (rotation plateau)
    RESPOND MSG="Homing terminé - Tous les axes à 0"

# ============================================================
# Macro de scan complet
# ============================================================

[gcode_macro SCAN_FULL]
description: Lance un scan 3D complet (360° rotation + translation X)
gcode:
    {% set step_y = printer["gcode_macro SCANNER_VARS"].scan_step_y %}
    {% set steps_total = printer["gcode_macro SCANNER_VARS"].scan_steps_total %}
    {% set step_x = printer["gcode_macro SCANNER_VARS"].scan_step_x %}
    {% set start_x = printer["gcode_macro SCANNER_VARS"].scan_start_x %}
    {% set end_x = printer["gcode_macro SCANNER_VARS"].scan_end_x %}

    RESPOND MSG="Démarrage scan 3D complet..."
    SET_GCODE_VARIABLE MACRO=SCANNER_VARS VARIABLE=scan_in_progress VALUE=1

    ; Homing initial
    SCANNER_HOME

    ; Activer les lasers
    LASERS_ON

    ; Déplacer vers position de départ
    G1 X{start_x} F3000

    ; Boucle de scan sur l'axe X
    {% set x_steps = ((end_x - start_x) / step_x) | int %}
    {% for xi in range(x_steps) %}
        {% set x_pos = start_x + (xi * step_x) %}
        G1 X{x_pos} F1000

        ; Rotation complète 360° pour chaque position X
        SCAN_ROTATE_360

        RESPOND MSG="Couche X {xi+1}/{x_steps} terminée (X={x_pos:.1f}mm)"
    {% endfor %}

    ; Fin de scan
    LASERS_OFF
    SCANNER_HOME
    SET_GCODE_VARIABLE MACRO=SCANNER_VARS VARIABLE=scan_in_progress VALUE=0
    RESPOND MSG="Scan 3D terminé!"

# ============================================================
# Macro de rotation 360° (un seul plan de scan)
# ============================================================

[gcode_macro SCAN_ROTATE_360]
description: Effectue une rotation complète 360° du plateau en capturant des données
gcode:
    {% set step_y = printer["gcode_macro SCANNER_VARS"].scan_step_y %}
    {% set steps_total = printer["gcode_macro SCANNER_VARS"].scan_steps_total %}

    G28 Y    ; Retour position 0 rotation
    G91      ; Mode relatif

    {% for i in range(steps_total) %}
        G1 Y{step_y} F500    ; Rotation d'un pas angulaire
        ; Pause pour capture (l'app Python capture via webhook Klipper)
        G4 P50               ; Attendre 50ms
    {% endfor %}

    G90      ; Retour mode absolu
    G28 Y    ; Retour position 0 rotation

# ============================================================
# Macro de scan rapide (résolution réduite)
# ============================================================

[gcode_macro SCAN_QUICK]
description: Scan rapide 360° à résolution réduite (pas de 5°)
gcode:
    RESPOND MSG="Démarrage scan rapide (5° par pas)..."
    SET_GCODE_VARIABLE MACRO=SCANNER_VARS VARIABLE=scan_step_y VALUE=5.0
    SET_GCODE_VARIABLE MACRO=SCANNER_VARS VARIABLE=scan_steps_total VALUE=72
    SCAN_ROTATE_360
    ; Restaurer résolution normale
    SET_GCODE_VARIABLE MACRO=SCANNER_VARS VARIABLE=scan_step_y VALUE=1.0
    SET_GCODE_VARIABLE MACRO=SCANNER_VARS VARIABLE=scan_steps_total VALUE=360
    RESPOND MSG="Scan rapide terminé"

# ============================================================
# Macro de calibration
# ============================================================

[gcode_macro CALIBRATE_SCANNER]
description: Procédure de calibration du scanner
gcode:
    RESPOND MSG="Démarrage calibration scanner..."
    SCANNER_HOME
    LASERS_ON
    G1 X110 F3000    ; Position centre X
    G1 Z50 F1000     ; Hauteur de calibration
    RESPOND MSG="Positionner un objet de référence et lancer la capture de calibration"
    G4 P5000         ; Pause 5 secondes
    LASERS_OFF
    RESPOND MSG="Calibration terminée - Analyser les images capturées"

# ============================================================
# Macro d'arrêt d'urgence
# ============================================================

[gcode_macro SCANNER_EMERGENCY_STOP]
description: Arrêt d'urgence du scanner
gcode:
    LASERS_OFF
    M84              ; Désactiver les moteurs
    SET_GCODE_VARIABLE MACRO=SCANNER_VARS VARIABLE=scan_in_progress VALUE=0
    RESPOND TYPE=error MSG="ARRÊT D'URGENCE - Scanner stoppé"

# ============================================================
# Macro de statut
# ============================================================

[gcode_macro SCANNER_STATUS]
description: Affiche le statut du scanner
gcode:
    {% set in_progress = printer["gcode_macro SCANNER_VARS"].scan_in_progress %}
    {% set laser_on = printer["gcode_macro SCANNER_VARS"].laser_enabled %}
    {% set x_pos = printer.toolhead.position.x %}
    {% set y_pos = printer.toolhead.position.y %}
    {% set z_pos = printer.toolhead.position.z %}
    RESPOND MSG="=== STATUT HORALTSCANNER ==="
    RESPOND MSG="Scan en cours: {'OUI' if in_progress else 'NON'}"
    RESPOND MSG="Lasers: {'ON' if laser_on else 'OFF'}"
    RESPOND MSG="Position X: {x_pos:.2f}mm (translation)"
    RESPOND MSG="Position Y: {y_pos:.2f}° (rotation)"
    RESPOND MSG="Position Z: {z_pos:.2f}mm (hauteur)"
    CHECK_TEMP
