# ============================================================
# Contrôle température et ventilateur - Horaltscanner
# Thermostat NTC 100K + Ventilateur 24V
# ============================================================

# ============================================================
# Sonde de température - NTC 100K sur broche PA0 (ADC0)
# ============================================================

[temperature_sensor board_temp]
# Température de la carte mère Creality V4.2.2
sensor_type: NTC 100K beta 3950
sensor_pin: PA0
# Résistance pull-up: 4.7K Ohm, tension 3.3V
pullup_resistor: 4700
min_temp: 0
max_temp: 100

# Température du Raspberry Pi 4
[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 0
max_temp: 100

# ============================================================
# Ventilateur de refroidissement - 24V contrôlé par relay
# ============================================================

# Ventilateur principal contrôlé par température
[temperature_fan board_fan]
# Broche de contrôle du ventilateur sur Creality V4.2.2
pin: PC6
sensor_type: NTC 100K beta 3950
sensor_pin: PA0
pullup_resistor: 4700
# Température de démarrage: 50°C
target_temp: 50.0
min_temp: 0
max_temp: 100
# Vitesse minimale pour démarrer le ventilateur (PWM)
min_speed: 0.3
max_speed: 1.0
# Contrôle proportionnel
control: watermark
max_delta: 2.0
off_below: 0.2

# Ventilateur toujours actif (refroidissement constant)
# Décommenter si tu veux un ventilateur toujours ON
# [fan]
# pin: PC6
# max_power: 1.0
# kick_start_time: 0.5

# ============================================================
# Alertes de température
# ============================================================

# Arrêt d'urgence si température trop élevée
[verify_heater extruder]
max_error: 120
check_gain_time: 20
heating_gain: 2

# ============================================================
# Macros de gestion thermique
# ============================================================

[gcode_macro CHECK_TEMP]
description: Vérifie les températures du système
gcode:
    {% set board_temp = printer['temperature_sensor board_temp'].temperature %}
    {% set pi_temp = printer['temperature_sensor raspberry_pi'].temperature %}
    RESPOND MSG="Température carte: {board_temp:.1f}°C"
    RESPOND MSG="Température Pi: {pi_temp:.1f}°C"
    {% if board_temp > 70 %}
        RESPOND TYPE=error MSG="ATTENTION: Température carte trop élevée! ({board_temp:.1f}°C)"
    {% endif %}
    {% if pi_temp > 75 %}
        RESPOND TYPE=error MSG="ATTENTION: Température Pi trop élevée! ({pi_temp:.1f}°C)"
    {% endif %}

[gcode_macro FAN_ON]
description: Active le ventilateur à pleine vitesse
gcode:
    SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=board_fan TARGET=30

[gcode_macro FAN_OFF]
description: Désactive le ventilateur (cible au-dessus du max_temp pour forcer l'arrêt)
gcode:
    # Klipper ne supporte pas SET_PIN direct sur un temperature_fan.
    # On lève la cible au-dessus de max_temp pour arrêter le ventilateur.
    # Vérifier que cette valeur est supérieure au max_temp configuré (100°C).
    SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=board_fan TARGET=110
