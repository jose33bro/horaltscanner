# ============================================================
# Configuration Klipper principale - Horaltscanner
# Scanner 3D: Raspberry Pi 4 + Creality V4.2.2 (STM32F103RET6)
# ============================================================

# Inclure les configurations modulaires
[include creality_v422_usb.cfg]
[include temperature_fan.cfg]
[include scanner_macros.cfg]

# ============================================================
# MCU secondaire - Raspberry Pi 4 GPIO (pour lasers)
# ============================================================

[mcu rpi]
serial: /tmp/klipper_host_mcu

# ============================================================
# Imprimante / cinématique du scanner
# ============================================================

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100

# ============================================================
# Virtual SD Card - Stockage des G-codes
# ============================================================

[virtual_sdcard]
path: /home/pi/gcode_files
on_error_gcode: CANCEL_PRINT

# ============================================================
# Pause / Reprise / Annulation
# ============================================================

[pause_resume]

[display_status]

[respond]
default_type: echo

# ============================================================
# Historique des impressions / scans
# ============================================================

[exclude_object]

# ============================================================
# Endstops - Configuration détaillée
# X: Translation - endstop position 0 (côté initial)
# Y: Rotation - endstop après 1 tour complet (position 0°)
# Z: Hauteur - endstop position 0 (alignement Lidar + caméra USB)
# ============================================================

# Les endstops sont définis dans creality_v422_usb.cfg

# ============================================================
# Sécurité
# ============================================================

[safe_z_home]
home_xy_position: 117.5, 117.5
speed: 50
z_hop: 10
z_hop_speed: 5

# ============================================================
# Interface réseau - Klipper API
# ============================================================

[api_server]
# Activé automatiquement par Moonraker

# ============================================================
# Macros système de base
# ============================================================

[gcode_macro CANCEL_PRINT]
description: Annuler le scan en cours
rename_existing: CANCEL_PRINT_BASE
gcode:
    SCANNER_EMERGENCY_STOP
    CANCEL_PRINT_BASE

[gcode_macro PAUSE]
description: Pause du scan
rename_existing: PAUSE_BASE
gcode:
    LASERS_OFF
    PAUSE_BASE

[gcode_macro RESUME]
description: Reprise du scan
rename_existing: RESUME_BASE
gcode:
    LASERS_ON
    RESUME_BASE

# ============================================================
# Configuration du bed (plateau de scan)
# ============================================================

[bed_screws]
screw1: 30, 30
screw2: 205, 30
screw3: 205, 205
screw4: 30, 205

