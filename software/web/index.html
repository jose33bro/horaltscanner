<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HoralScanner PRO – 3D Scanner</title>
  <link rel="stylesheet" href="style.css">
  <!-- Three.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/examples/js/loaders/STLLoader.js"></script>
</head>
<body>
  <!-- Header -->
  <header class="app-header">
    <div class="header-left">
      <span class="logo">🔍 HoralScanner PRO</span>
    </div>
    <nav class="tab-nav" id="main-tabs">
      <button class="tab-btn active" data-tab="scanner">🔍 Scanner</button>
      <button class="tab-btn" data-tab="viewer3d">🎨 Vue 3D</button>
      <button class="tab-btn" data-tab="slicer">🖨️ Slicer</button>
      <button class="tab-btn" data-tab="queue">📋 File impression</button>
      <button class="tab-btn" data-tab="settings">⚙️ Paramètres</button>
    </nav>
    <div class="header-right">
      <span id="conn-status" class="conn-badge">⚡ Connexion...</span>
    </div>
  </header>

  <!-- Toast container -->
  <div id="toast-container"></div>

  <!-- Main content -->
  <main id="app-main">
    <div id="tab-scanner" class="tab-panel active"></div>
    <div id="tab-viewer3d" class="tab-panel"></div>
    <div id="tab-slicer" class="tab-panel"></div>
    <div id="tab-queue" class="tab-panel"></div>
    <div id="tab-settings" class="tab-panel"></div>
  </main>

  <!-- Components -->
  <script src="components/scanner.js"></script>
  <script src="components/viewer3d.js"></script>
  <script src="components/slicer.js"></script>
  <script src="components/queue.js"></script>
  <script src="components/settings.js"></script>
  <!-- Main app -->
  <script src="app.js"></script>
</body>
</html>
