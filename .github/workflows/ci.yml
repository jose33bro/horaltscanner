name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CI dependencies (non-Raspberry)
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov flask flask-cors requests numpy scipy pyyaml python-dateutil pyserial pillow

      - name: Run tests
        run: python -m pytest -q software/tests
